[base]
env_name = cnc_micro
seed = 73
checkpoint_interval = 512
eval_episodes = 10000
log_interval = 1.8
cudagraphs = 10
reset_state = True

[env]
seed = 1
max_decisions = 12000
# ABI13 samples one actor and then conditions target logits on that actor. This is required for
# E1/E3/tank matchup selection; ABI14 gives an entire selected group one shared target.
action_scheme = 0
action_abi = 13
# Reverse curriculum, with short early lanes and enough time for defended full-match play.
curriculum_schedule_id = 1
curriculum_stage_decisions = 256
starting_force_ramp_decisions = 2048
difficulty_schedule_id = 1
difficulty_ramp_decisions = 65536

# Deliberately small reward surface. Keep only two useful waypoints, the two new one-time armour
# events, and terminal grading. Production counts, infantry activity, income drips, build-order
# rules, and kill bounties are diagnostics rather than competing objectives.
reward_milestone = 0.0
reward_player_infantry = 0.0
reward_enemy_unit_loss = 0.0
reward_enemy_building_loss = 1.0
reward_player_unit_loss = 0.0
# Exact value from CNC35 candidate 6b9gtxps, the current best ABI13 full-performance result.
reward_refinery = 0.41556156948208806
reward_first_delivery = 0.0
reward_weapons_factory = 0.0
reward_vehicle = 0.0
reward_full_win = 1.0
reward_partial_win = 0.1
economy_win_credits = 1000
full_win_min_tanks = 1
full_win_min_humvees = 0
full_win_min_tank_shots = 1
reward_tiberium_income = 0.0
reward_invalid_action = 0.0
reward_build_order_violation = 0.0
reward_build_order_violation_constrained = 0.0
reward_build_order_sequence = 0.0
reward_tank_kill = 0.0
reward_first_tank = 0.1
reward_first_tank_shot = 0.1
# CNC33 found no conversion benefit from softening qualified defeats. Every loss is terminal -1.
reward_qualified_loss = -1.0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 4

[policy]
hidden_size = 128
num_layers = 1
expansion_factor = 1

[torch]
network = MinGRU
encoder = Normalize255Encoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 5_654_528
schedule_timesteps = 10_485_760
learning_rate = 0.0016686385180657176
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.8
gae_lambda = 0.990465066239817
replay_ratio = 6.186031978757118
clip_coef = 0.9031069993316927
vf_coef = 4.2251357539485905
vf_clip_coef = 7.5199867468135695
max_grad_norm = 1.0568165287176148
ent_coef = 0.001020874224661776
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.6641371823833893
beta2 = 0.8
eps = 1.0291609145977196e-14
horizon = 32
minibatch_size = 2048
vtrace_rho_clip = 0.5706404606934145
vtrace_c_clip = 5.0
prio_alpha = 0.07250505007042979
prio_beta0 = 0.0
checkpoint_interval = 512

[sweep]
metric = full_perf
downsample = 1
# Retain the requested 5-10M range for later searches. The default values above reproduce
# 6b9gtxps as a normal checkpointed run.
sweep_only = train.total_timesteps, env.reward_refinery
use_gpu = False

[sweep.train.total_timesteps]
distribution = int_uniform
min = 5242880
max = 10485760
mean = 7340032
scale = auto

[sweep.env.reward_refinery]
distribution = uniform
min = 0.3
max = 0.6
mean = 0.41556156948208806
scale = auto
